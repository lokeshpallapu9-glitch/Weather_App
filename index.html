<!DOCTYPE html>
<html>
    <head>
        <title>Weather App</title>
        <link rel="stylesheet" href="index.css">
    </head>

<body>
    <div class="weather-card">
        
        
        <h1 class="app-title">
            <span class="brand-icon">☁</span> Atmos
        </h1>
        <p class="app-subtitle">Weather, beautifully understood.</p>

        <div class="search-box">
            <input class="ip" type="text" placeholder="Enter city name">
            <button class="searchbtn" aria-label="Search weather">
                <span>🔍</span>
            </button>
        </div>

        <p class="invalid">City not found. Please try again.</p>

        <div class="weather-info">
            <img
                class="weather-icon"
                src="https://openweathermap.org/img/wn/01d@2x.png"
                alt="Weather condition"
            >

            <h1 class="temp">--°C</h1>
            <h2 class="city">Search for a city</h2>
            <p class="description">Current weather</p>

            <div class="details">
                <div class="col">
                    <span class="detail-icon">💧</span>
                    <div>
                        <p class="humidity">--%</p>
                        <p>Humidity</p>
                    </div>
                </div>

                <div class="col">
                    <span class="detail-icon">💨</span>
                    <div>
                        <p class="wind">-- m/s</p>
                        <p>Wind speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>

</html>
