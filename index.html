<!DOCTYPE html>
<html>
    <head>
        <title>Weather App</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="d1">
            <div class="d2">
                <input class="ip" type="text" placeholder="Enter City Name">
                <button class="searchbtn"><img class="img1" src="https://static.vecteezy.com/system/resources/previews/015/337/677/non_2x/transparent-search-icon-free-png.png"></button>
            </div>
            <div class="invalid">
                <p>City Not Found </p>
            </div>
            <div class="d3">
                <img class="weather-icon" src="https://tse3.mm.bing.net/th/id/OIP.XDbcA2jlRRhRnukTnMS1LwHaHa?pid=Api&P=0&h=180">
                <h1 class="temp">40°c</h1>
                <h1 class="city">Andra Pradesh</h1>
                <div class="details">
                    <div class="col">
                        <img class="hum" src="https://tse4.mm.bing.net/th/id/OIP.p9a_ggjfjzDBUQ6zv5o2OAHaHa?pid=Api&P=0&h=180">
                        <div>
                            <p class="humidity">50%</p>
                            <p>Humidity</p>
                        </div>
                    </div>
                    <div class="col">
                        <img class="win" src="https://tse2.mm.bing.net/th/id/OIP.0xEV2J6WqybuUCLftelPPgHaFq?pid=Api&P=0&h=180">
                        <div>
                            <p class="wind">15 km/h</p>
                            <p>Wind</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="index.js">

    </script>
</html>
